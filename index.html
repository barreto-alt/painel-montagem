<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Montagem – Torres Elevadores</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
  header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);color:#fff;padding:20px 32px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.4rem;font-weight:700;letter-spacing:.5px}
  header span{font-size:.85rem;opacity:.7;margin-left:auto}
  .main{padding:24px 32px;max-width:1400px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #ddd}
  .kpi.green{border-color:#22c55e}.kpi.blue{border-color:#3b82f6}.kpi.orange{border-color:#f59e0b}.kpi.red{border-color:#ef4444}.kpi.gray{border-color:#94a3b8}
  .kpi-val{font-size:2rem;font-weight:800;line-height:1}
  .kpi-pct{font-size:.85rem;color:#888;margin-top:2px}
  .kpi-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:#666;margin-top:8px}
  .charts-row{display:grid;grid-template-columns:1fr 1.8fr 1fr;gap:16px;margin-bottom:24px}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .card h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;color:#666;margin-bottom:16px;font-weight:600}
  .chart-wrap{position:relative;height:220px;display:flex;align-items:center;justify-content:center}
  .filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .filters input,.filters select{border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:.85rem;outline:none;color:#1a1a2e;background:#fff}
  .filters input:focus,.filters select:focus{border-color:#3b82f6}
  .filters input{flex:1;min-width:200px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .b-fin{background:#dcfce7;color:#16a34a}
  .b-conc{background:#dbeafe;color:#1d4ed8}
  .b-and{background:#fef9c3;color:#854d0e}
  .b-ag{background:#fee2e2;color:#dc2626}
  .b-sem{background:#f1f5f9;color:#64748b}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:600;color:#475569;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e2e8f0;position:sticky;top:0;z-index:1}
  td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tr:hover td{background:#f8fafc}
  .fase-dots{display:flex;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .dot-conc{background:#22c55e}.dot-and{background:#f59e0b}.dot-ag{background:#ef4444}.dot-sem{background:#cbd5e1}
  .tbl-wrap{overflow:auto;max-height:480px}
  .obs-cell{font-size:.75rem;color:#94a3b8;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .count-info{font-size:.8rem;color:#94a3b8;margin-left:auto}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.charts-row{grid-template-columns:1fr}}
</style>
</head>

<header>
  <div>
    <div style="font-size:.75rem;opacity:.6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Torres Elevadores</div>
    <h1>Controle de Montagem de Obras</h1>
  </div>
  <span id="updateTime"></span>
</header>
<div class="main">
  <div class="kpis" id="kpis"></div>
  <div class="charts-row">
    <div class="card">
      <h2>Status Final</h2>
      <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
    </div>
    <div class="card">
      <h2>Conclusão por Fase</h2>
      <div class="chart-wrap"><canvas id="chartFases"></canvas></div>
    </div>
    <div class="card">

      <div class="chart-wrap"><canvas id="chartTipos"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="filters">
      <input id="search" type="text" placeholder="Buscar obra ou equipamento…">
      <select id="filtStatus">
        <option value="">Todos os status</option>
        <option>Finalizado</option><option>Concluído</option><option>Em Andamento</option><option>Aguardando</option><option>Sem Status</option>
      </select>
      <select id="filtTipo">
        <option value="">Todos os tipos</option>
        <option>Social</option><option>Serviço</option><option>PNE</option><option>Plataforma</option><option>Hidráulico</option><option>Monta-Carga</option><option>Outros</option>
      </select>
      <select id="filtFase">
        <option value="">Qualquer fase</option>
        <option value="Bloqueado">Com fase bloqueada</option>
        <option value="Em Andamento">Com fase em andamento</option>
      </select>
      <span class="count-info" id="countInfo"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Obra</th><th>Equip.</th><th>Paradas</th>
          <th title="Suporte+Guias · Máquina+QC · Batentes · Fiação · Barra+Portas · Cabinas">Fases ●●●●●●</th>
          <th>Status Final</th><th>Observação</th>
        </tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>
</div>

function normColor(s) {
  const u = (s||'').toUpperCase();
  if(u.includes('FINALIZADO')) return 'Finalizado';
  if(u.includes('CONCLU') || u.includes('CNCLU') || u.includes('CONLU') || u.includes('CONCLÍDO')) return 'Concluído';
  if(u.includes('EM AND') || u.includes('EM PROD') || u.includes('PISCINA') || u.includes('TÉRREO') || u.includes('EM NDAMENTO') || u.includes('EM ANDAIMENTO') || u.includes('EM ANDAMETO')) return 'Em Andamento';
  if(u.includes('AGUARD') || u.includes('A LIBERAR') || u.includes('ARAME') || u.includes('FALTA') || u.includes('NÃO') || u.includes('VAMOS') || u.includes('PRONTA') || u.includes('JÁ NA') || u.includes('MAQUINA ENTREGUE') || u.includes('RECEBEU')) return 'Aguardando';
  if(!u || !u.trim()) return 'Sem Status';
  return 'Em Andamento';
}

function badgeClass(s) {
  if(s==='Finalizado') return 'b-fin';
  if(s==='Concluído') return 'b-conc';
  if(s==='Em Andamento') return 'b-and';
  if(s==='Aguardando') return 'b-ag';
  return 'b-sem';
}

function dotClass(s) {
  if(!s||!s.trim()) return 'dot dot-sem';
  const u = s.toUpperCase();
  if(u.includes('FINALIZADO')||u.includes('CONCLU')||u.includes('CNCLU')||u.includes('CONLU')) return 'dot dot-conc';
  if(u.includes('EM AND')||u.includes('EM PROD')||u.includes('PISCINA')||u.includes('TÉRREO')||u.includes('ANDAIMENTO')||u.includes('ANDAMETO')||u.includes('NDAMENTO')) return 'dot dot-and';
  if(u.includes('AGUARD')||u.includes('FALTA')||u.includes('NÃO')||u.includes('A LIBERAR')||u.includes('ARAME')||u.includes('VAMOS')||u.includes('PRONTA')||u.includes('JÁ NA')||u.includes('MAQUINA ENTREGUE')||u.includes('RECEBEU')) return 'dot dot-ag';
  return 'dot dot-sem';
}

// KPIs

  const s = normColor(r.status_final);

// Chart: Fases
const faseNames = ['Suporte + Guias','Máquina + QC + Ferragem','Batentes','Fiação','Barra e Portas','Cabinas'];
const faseShort = ['Suporte','Máquina','Batentes','Fiação','Barra/Portas','Cabinas'];
const faseCats = ['Concluído','Em Andamento','Bloqueado','Sem Status'];
const faseColors = {'Concluído':'#22c55e','Em Andamento':'#f59e0b','Bloqueado':'#ef4444','Sem Status':'#e2e8f0'};
const faseCounts = faseNames.map((fn,fi) => {
  const counts = {};
  DATA.forEach(r => {
    const st = r.fases[fi].status;
    const u = (st||'').toUpperCase();
    let cat;
    if(!u||!u.trim()) cat='Sem Status';
    else if(u.includes('FINALIZADO')||u.includes('CONCLU')||u.includes('CNCLU')||u.includes('CONLU')) cat='Concluído';
    else if(u.includes('EM AND')||u.includes('EM PROD')||u.includes('PISCINA')||u.includes('TÉRREO')||u.includes('ANDAIMENTO')||u.includes('NDAMENTO')||u.includes('ANDAMETO')) cat='Em Andamento';
    else cat='Bloqueado';
    counts[cat]=(counts[cat]||0)+1;
  });
  return counts;
});

new Chart(document.getElementById('chartFases'),{
  type:'bar',

// Table
const tbody = document.getElementById('tblBody');
const searchEl = document.getElementById('search');
const filtStatus = document.getElementById('filtStatus');
const filtTipo = document.getElementById('filtTipo');
const filtFase = document.getElementById('filtFase');
const countInfo = document.getElementById('countInfo');

function renderTable() {
  const q = searchEl.value.toLowerCase();
  const fs = filtStatus.value;
  const ft = filtTipo.value;
  const ff = filtFase.value;
  let visible = DATA.filter(r => {
    if(q && !r.obra.toLowerCase().includes(q) && !r.equip.toLowerCase().includes(q)) return false;
    if(fs && normColor(r.status_final) !== fs) return false;
    if(ft && r.tipo !== ft) return false;
    if(ff === 'Bloqueado') {
      const hasBloq = r.fases.some(f => {
        const u=(f.status||'').toUpperCase();
        return u.includes('AGUARD')||u.includes('FALTA')||u.includes('A LIBERAR')||u.includes('ARAME');
      });
      if(!hasBloq) return false;
    }
    if(ff === 'Em Andamento') {
      const hasAnd = r.fases.some(f => {
        const u=(f.status||'').toUpperCase();
        return u.includes('EM AND')||u.includes('EM PROD')||u.includes('PISCINA')||u.includes('TÉRREO')||u.includes('ANDAIMENTO')||u.includes('NDAMENTO')||u.includes('ANDAMETO');
      });
      if(!hasAnd) return false;
    }
    return true;
  });
  countInfo.textContent = visible.length + ' de ' + DATA.length + ' registros';
  tbody.innerHTML = visible.map(r => {
    const sn = normColor(r.status_final);
    const dots = r.fases.map(f=>`<span class="${dotClass(f.status)}" title="${f.nome}: ${f.status||'Sem status'}"></span>`).join('');
    const obsText = r.pendente || r.obs || '';
    return `<tr>
      <td><strong>${r.obra}</strong></td>
      <td>${r.equip}</td>
      <td style="text-align:center">${r.paradas||''}</td>
      <td><div class="fase-dots">${dots}</div></td>
      <td><span class="badge ${badgeClass(sn)}">${sn}</span></td>
      <td class="obs-cell" title="${obsText}">${obsText}</td>
    </tr>`;
  }).join('');
}

searchEl.addEventListener('input', renderTable);
filtStatus.addEventListener('change', renderTable);
filtTipo.addEventListener('change', renderTable);
filtFase.addEventListener('change', renderTable);
renderTable();

document.getElementById('updateTime').textContent = 'Atualizado em: ' + new Date().toLocaleDateString('pt-BR');
